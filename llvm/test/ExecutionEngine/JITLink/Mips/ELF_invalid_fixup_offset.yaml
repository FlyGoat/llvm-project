# RUN: yaml2obj %s -o %t.o
# RUN: not llvm-jitlink -noexec %t.o 2>&1 | FileCheck %s

# CHECK: relocation fixup extends past the end of its block

--- !ELF
FileHeader:
  Class:   ELFCLASS32
  Data:    ELFDATA2LSB
  Type:    ET_REL
  Machine: EM_MIPS
  Flags:   [ EF_MIPS_ARCH_32 ]
Sections:
  - Name:         .text
    Type:         SHT_PROGBITS
    Flags:        [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 4
    Size:         4
  - Name:         .rel.text
    Type:         SHT_REL
    Flags:        [ SHF_INFO_LINK ]
    Info:         .text
    AddressAlign: 4
    Relocations:
      - Offset: 4
        Symbol: main
        Type:   R_MIPS_32
Symbols:
  - Name:    main
    Type:    STT_FUNC
    Binding: STB_GLOBAL
    Section: .text
    Size:    4
...
