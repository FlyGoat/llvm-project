# RUN: yaml2obj %s -o %t.o
# RUN: not llvm-jitlink -noexec %t.o 2>&1 | FileCheck %s

# CHECK: section .text+0x4: relocation fixup extends past the end of its block

--- !ELF
FileHeader:
  Class:   ELFCLASS64
  Data:    ELFDATA2LSB
  Type:    ET_REL
  Machine: EM_MIPS
  Flags:   [ EF_MIPS_ARCH_64 ]
Sections:
  - Name:         .text
    Type:         SHT_PROGBITS
    Flags:        [ SHF_ALLOC, SHF_EXECINSTR ]
    AddressAlign: 8
    Size:         8
  - Name:         .rela.text
    Type:         SHT_RELA
    Flags:        [ SHF_INFO_LINK ]
    Info:         .text
    AddressAlign: 8
    Relocations:
      - Offset: 4
        Symbol: main
        Type:   R_MIPS_64
        Addend: 0
Symbols:
  - Name:    main
    Type:    STT_FUNC
    Binding: STB_GLOBAL
    Section: .text
    Size:    8
...
